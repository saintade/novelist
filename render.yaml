services:
  - type: web
    name: novelist
    runtime: node
    plan: free
    numInstances: 1
    autoDeployTrigger: 'off'
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    maxShutdownDelaySeconds: 300
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: NODE_ENV
        value: production
      - key: VITE_AUTH_MODE
        value: private
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NOVELIST_ALLOWED_USER_ID
        sync: false
      - key: NOVELIST_PUBLIC_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NOVELIST_ENABLE_LIVE_AI
        value: 'false'
      - key: OPENAI_TRANSLATION_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_CHAT_MODEL
        value: gpt-4.1-mini
      - key: NOVELIST_AI_CONCURRENCY
        value: '2'
      - key: NOVELIST_AI_REQUESTS_PER_HOUR
        value: '0'